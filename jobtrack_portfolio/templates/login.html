{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-intro"><span class="eyebrow">WELCOME BACK</span><h1>Small steps.<br><span>Big progress.</span></h1><p>Pick up where you left off and keep your career momentum going.</p></div>
  <form class="form-card" method="post">
    <h2>Sign in to JobTrack</h2><p class="muted">Your applications are waiting.</p>
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
    <button class="button button-full" type="submit">Sign in <span aria-hidden="true">→</span></button>
    <p class="form-bottom">New to JobTrack? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
